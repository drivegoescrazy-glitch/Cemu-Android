name: Build and release Android APK

on:
  push:
    branches: [android-port]
    paths:
      - "src/android/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "dependencies/**"
      - "vcpkg.json"
      - "src/**"
      - ".gitmodules"
      - ".github/workflows/android-apk-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # Avoid vcpkg trying to download its own copies of CMake and Ninja.
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      VCPKG_DISABLE_METRICS: "1"
      # Keep native dependency builds within the memory budget of hosted runners.
      VCPKG_MAX_CONCURRENCY: "2"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install native build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl zip unzip tar

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-android-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg/versions/baseline.json') }}
          restore-keys: |
            vcpkg-android-${{ runner.os }}-

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: src/android/**/*.gradle*

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ] && [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK command-line tools not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin" ]; then
            echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f -print | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --version

      - name: Install Android native build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_APPLICATION_ID=info.cemu.cemu.build${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "EMULATOR_VERSION_MAJOR=0" >> "$GITHUB_ENV"
          echo "EMULATOR_VERSION_MINOR=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        run: bash ./dependencies/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Make Gradle wrapper executable
        run: chmod +x src/android/gradlew

      - name: Build ARM64 APK
        working-directory: src/android
        run: ./gradlew --no-daemon --stacktrace --info assembleGithubRelease

      - name: Verify APK output
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src/android/app/build/outputs/apk/githubRelease -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" "release-assets/Cemu-Android-${GITHUB_RUN_NUMBER}-arm64.apk"
          echo "path=release-assets/Cemu-Android-${GITHUB_RUN_NUMBER}-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Android-${{ github.run_number }}-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Cemu Android build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Automated ARM64 Android build from commit ${{ github.sha }}.

            This build uses a unique application ID (`info.cemu.cemu.build${{ github.run_number }}`) so it can be installed alongside other builds. Performance has not been benchmarked on physical hardware; no specific FPS improvement is guaranteed.

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cemu-android-diagnostics-${{ github.run_number }}
          path: |
            src/android/app/build/reports/**
            src/android/app/build/outputs/logs/**
            src/android/app/.cxx/**
            dependencies/vcpkg/buildtrees/**/*.log
            dependencies/vcpkg/buildtrees/**/*.txt
          if-no-files-found: warn
          retention-days: 14
